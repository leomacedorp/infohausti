    <script>
        // Configurações
        const TELEFONE_WHATSAPP = "5516991571314";

        // Atualiza ano automaticamente
        document.getElementById('anoAtual').textContent = new Date().getFullYear();

        // Menu Mobile
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            const btn = document.getElementById('menuBtn');
            const isOpen = menu.classList.contains('open');
            
            if (isOpen) {
                menu.classList.remove('open');
                btn.setAttribute('aria-expanded', 'false');
                document.body.style.overflow = '';
            } else {
                menu.classList.add('open');
                btn.setAttribute('aria-expanded', 'true');
                document.body.style.overflow = 'hidden';
            }
        }

        // Validação e envio do WhatsApp
        function enviarWhatsApp() {
            const servico = document.getElementById('servico');
            const tamanho = document.getElementById('tamanho');
            const nome = document.getElementById('nome');
            const email = document.getElementById('email');
            const obs = document.getElementById('mensagem_obs');
            const btn = document.getElementById('btnOrcamento');
            const btnTexto = document.getElementById('btnTexto');
            const btnIcone = document.getElementById('btnIcone');
            const btnLoading = document.getElementById('btnLoading');
            
            let hasError = false;

            // Reset errors
            [servico, tamanho, nome].forEach(el => {
                el.classList.remove('error');
                const erroId = 'erro-' + el.id;
                const erroEl = document.getElementById(erroId);
                if (erroEl) erroEl.classList.add('hidden');
            });

            // Validação
            if (!servico.value) {
                servico.classList.add('error');
                document.getElementById('erro-servico').classList.remove('hidden');
                hasError = true;
            }
            if (!tamanho.value) {
                tamanho.classList.add('error');
                document.getElementById('erro-tamanho').classList.remove('hidden');
                hasError = true;
            }
            if (!nome.value.trim()) {
                nome.classList.add('error');
                document.getElementById('erro-nome').classList.remove('hidden');
                hasError = true;
            }

            if (hasError) {
                // Shake animation no botão
                btn.style.transform = 'translateX(-5px)';
                setTimeout(() => btn.style.transform = 'translateX(5px)', 50);
                setTimeout(() => btn.style.transform = 'translateX(-5px)', 100);
                setTimeout(() => btn.style.transform = 'translateX(5px)', 150);
                setTimeout(() => btn.style.transform = 'translateX(0)', 200);
                return;
            }

            // Loading state
            btn.disabled = true;
            btnTexto.textContent = 'Redirecionando...';
            btnIcone.classList.add('hidden');
            btnLoading.classList.remove('hidden');

            // Monta mensagem
            let mensagem = `Olá INFOHAUS TI! Meu nome é ${nome.value.trim()} e gostaria de um orçamento.\n\n`;
            mensagem += `*Serviço:* ${servico.value}\n`;
            mensagem += `*Porte da empresa:* ${tamanho.value}\n`;
            if (email.value.trim()) {
                mensagem += `*E-mail:* ${email.value.trim()}\n`;
            }
            if (obs.value.trim()) {
                mensagem += `\n*Observações:* ${obs.value.trim()}`;
            }

            const url = `https://wa.me/${TELEFONE_WHATSAPP}?text=${encodeURIComponent(mensagem)}`;
            
            setTimeout(() => {
                window.open(url, '_blank');
                
                // Reset button
                btn.disabled = false;
                btnTexto.textContent = 'Solicitar Orçamento via WhatsApp';
                btnIcone.classList.remove('hidden');
                btnLoading.classList.add('hidden');
            }, 800);
        }

        // Remove error on input
        ['servico', 'tamanho', 'nome'].forEach(id => {
            document.getElementById(id).addEventListener('change', function() {
                this.classList.remove('error');
                const erroEl = document.getElementById('erro-' + this.id);
                if (erroEl) erroEl.classList.add('hidden');
            });
        });

        // Scroll Animation (Intersection Observer)
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.fade-in').forEach(el => {
            observer.observe(el);
        });

        // Navbar scroll effect
        let lastScroll = 0;
        const nav = document.querySelector('nav');
        
        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            
            if (currentScroll > 100) {
                nav.classList.add('shadow-lg', 'shadow-black/20');
            } else {
                nav.classList.remove('shadow-lg', 'shadow-black/20');
            }
            
            lastScroll = currentScroll;
        });
    </script>
