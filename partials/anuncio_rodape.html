    <div class="w-full max-w-4xl min-h-[90px] flex items-center justify-center bg-slate-200/50 rounded overflow-hidden">

      [ADSENSE RODAPÉ - ATIVAÇÃO NO BLOCO F4]
      <ins class="adsbygoogle"
           style="display:block; width:100%; text-align:center;"

           data-ad-slot="{{ adsense_slot_rodape | default('1122334455') }}"
           data-ad-format="horizontal"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
