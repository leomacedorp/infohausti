    <div class="w-full max-w-4xl min-h-[90px] flex items-center justify-center bg-slate-200/50 rounded overflow-hidden">

      [ADSENSE TOPO - ATIVAÇÃO NO BLOCO F4]
      <ins class="adsbygoogle"
           style="display:block; width:100%; text-align:center;"

           data-ad-slot="{{ adsense_slot_topo | default('1234567890') }}"
           data-ad-format="horizontal"
           data-full-width-responsive="true"></ins>
